name: RIDE CPU smoke test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - run: python -m pip install 'ride-control-plane @ git+https://github.com/vLLM-HUST/ride.git@e4fb25ec6920624c29f1ad2f261a6e8a4e55755b' .
      - run: python -m unittest discover -s tests -v
        env:
          RIDE_MANAGED_SMOKE: '1'
